name: Bug or wrong verdict
description: Referee crashed, gave a verdict you think is wrong for honest code, or the docs are wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a way to make Referee PASS code that shouldn't pass, or to escape the sandbox?
        Please report it privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command you ran, the verdict lines, and what you expected.
      render: text
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: verdict.json of the run (from the evidence folder), or the whole folder zipped.
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "QNX SDP 8.0, QEMU x86_64 on WSL2 Ubuntu 24.04, Python 3.12"
